name: Screenshots and Submit

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        XCODE_APP=$(ls /Applications/ | grep "^Xcode_" | sort -V | tail -1)
        sudo xcode-select -s "/Applications/$XCODE_APP"
        xcodebuild -version

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate project
      run: xcodegen generate

    - name: Capture Screenshots
      run: |
        set -e
        echo "=== SDKs ==="; xcodebuild -showsdks 2>/dev/null | grep -i simulator || true
        echo "=== iOS runtimes ==="; xcrun simctl list runtimes | grep -i ios || true
        # Build once for a generic simulator; the same .app installs on iPhone and iPad sims.
        timeout 1500 xcodebuild build -scheme AngelicVoice -configuration Release \
          -destination "generic/platform=iOS Simulator" \
          -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO | tail -5
        APP=$(find build/sim/Build/Products -maxdepth 3 -name "*.app" | head -1)
        echo "APP=$APP"; [ -z "$APP" ] && { echo "no .app built"; exit 1; }

        capture() {
          NAME="$1"; OUT="$2"
          UDID=$(xcrun simctl list devices available | grep -E "$NAME \(" | head -1 | grep -oiE "[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}")
          echo "device '$NAME' -> udid=$UDID"
          [ -z "$UDID" ] && { echo "  skip (device not found)"; return 0; }
          xcrun simctl boot "$UDID" || true
          timeout 240 xcrun simctl bootstatus "$UDID" || true
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.tokyonasu.AngelicVoice --demo || true
          mkdir -p "$(dirname "$OUT")"
          sleep 14
          xcrun simctl io "$UDID" screenshot "$OUT" || true
          xcrun simctl shutdown "$UDID" || true
        }

        IPHONE=$(xcrun simctl list devices available | grep -oE "iPhone 16 Pro Max" | head -1)
        [ -z "$IPHONE" ] && IPHONE=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+ Pro Max" | tail -1)
        IPAD=$(xcrun simctl list devices available | grep -oE "iPad Pro 13-inch \(M[0-9]+\)" | head -1)
        [ -z "$IPAD" ] && IPAD=$(xcrun simctl list devices available | grep -oE "iPad Pro [0-9]+-inch \(M[0-9]+\)" | head -1)
        [ -z "$IPAD" ] && IPAD=$(xcrun simctl list devices available | grep -oE "iPad Pro[^(]*\(M[0-9]+\)" | head -1)
        echo "iPhone=$IPHONE  iPad=$IPAD"

        capture "$IPHONE" shots/iphone/1.png
        capture "$IPAD" shots/ipad/1.png
        ls -la shots/iphone shots/ipad || true

    - name: Upload screenshot artifacts
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: shots/

    - name: Set up ASC API Key
      env:
        ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$ASC_API_KEY_CONTENT" | base64 -D > ~/.appstoreconnect/private_keys/AuthKey_WDXGY9WX55.p8

    - name: Install PyJWT
      run: pip3 install --break-system-packages PyJWT requests

    - name: Upload Screenshots to ASC
      env:
        ASC_LOC_ID: c9a19e08-6914-4ace-96cd-dd0f2addd9e0
      run: python3 scripts/upload_screenshots.py

    - name: Submit for Review
      env:
        ASC_APP_ID: '6796853280'
      run: python3 scripts/submit_review.py
